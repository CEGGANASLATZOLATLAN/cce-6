{% extends 'base.html' %}
{% block title %}Şifremi Unuttum{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="display-4 mb-2">🔑</div>
      <h2 class="fw-bold">Şifre Sıfırla</h2>
      <p class="text-muted">Kullanıcı adınla yeni şifre belirle</p>
    </div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-medium">Kullanıcı Adı</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" name="username" class="form-control border-start-0"
                     placeholder="Kullanıcı adın" required autofocus/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-medium">Yeni Şifre</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" name="new_password" class="form-control border-start-0"
                     placeholder="Yeni şifre" required/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-medium">Yeni Şifre Tekrar</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="password" name="confirm_password" class="form-control border-start-0"
                     placeholder="Şifreyi tekrar gir" required/>
            </div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold py-2">
            <i class="bi bi-key me-2"></i>Şifreyi Güncelle
          </button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3">
      <a href="{{ url_for('login') }}" class="text-primary small">
        <i class="bi bi-arrow-left me-1"></i>Giriş sayfasına dön
      </a>
    </div>
  </div>
</div>
{% endblock %}
